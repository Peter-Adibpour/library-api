[project]
name = "library-api"
version = "1.0.0"
description="Manage library members and their borrowed books. Assignment 1 API demonstrating FastAPI routes, Pydantic validation, and OpenAPI contracts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.116.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.16.2",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.2.0",
    "pytest-mock>=3.17.0",
    "schemathesis>=4.33.4",
    "testcontainers>=4.15.0",
]
