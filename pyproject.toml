[project]
name = "library-api"
version = "1.0.0"
description="Manage library members and their borrowed books. Assignment 1 API demonstrating FastAPI routes, Pydantic validation, and OpenAPI contracts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.116.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.9",
]
